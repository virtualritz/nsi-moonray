[package]
name = "nsi-moonray"
version = "0.1.0"
authors = ["Moritz Moeller <virtualritz@protonmail.com>"]
edition = "2024"
# Matches the `nsi` workspace upstream.
rust-version = "1.88"
keywords = ["graphics", "rendering", "3d", "ray-tracing", "moonray"]
categories = ["graphics", "multimedia::images", "rendering::graphics-api"]
license = "MIT OR Apache-2.0 OR Zlib"
description = "An ɴsɪ backend on MoonRay, DreamWorks Animation's production renderer."
repository = "https://github.com/virtualritz/nsi-moonray/"
# Whitelist rather than blacklist, as upstream does: an `exclude` list
# silently ships `.specify/`, `specs/` and the handoff notes.
include = [
    "src/**/*",
    "shim/**/*",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
]

[lib]
# `cdylib` so this can be `dlopen`ed as an ɴsɪ renderer -- see
# `src/capi.rs`; `rlib` so the flush stays usable as a Rust library.
crate-type = ["rlib", "cdylib"]

[features]
# Link `scene_rdl2` -- and, with it, build the scene in memory rather
# than writing a file. Off by default because it needs `scene_rdl2`
# installed and `$SCENE_RDL2_ROOT` pointing at it, while everything
# else here -- the emitter, the oracle, the flush -- is checked without
# a renderer and must stay that way.
rdl2 = []

[build-dependencies]
# Builds `shim/src/scene.cc` when the `rdl2` feature is on. Not
# optional: a build script sees features as `CARGO_FEATURE_*` in the
# environment, never as a `cfg`, so it compiles either way and has to
# name what it might use. Build-only, so it costs no runtime
# dependency.
cc = "1"

[dependencies]
# The intermediate representation this backend flushes, overlaid from a
# sibling checkout of https://github.com/virtualritz/nsi.
#
# A path dependency, and deliberately so *for now*: the crate is
# unpublished, and a git dependency on that workspace makes Cargo fetch
# the repository's private `.blueprints` submodule, which fails without
# access to it. `[patch]` does not help -- Cargo fetches the patched
# source anyway. So until `nsi-intermediate` is published, or the
# submodule stops blocking a fetch, building this crate means cloning
# `nsi` next to it. `T0.7`.
nsi-intermediate = { path = "../nsi/crates/nsi-intermediate" }
# The ɴsɪ types the C entry points speak: `FfiParam` is layout-identical
# to `NSIParam_t`, and `Type` carries the `NSIType_t` values.
nsi-trait = { path = "../nsi/crates/nsi-trait" }
# For the output-driver callbacks an application hands ɴsɪ. MoonRay has
# no display-driver interface, so this crate calls those closures
# itself; see `src/display.rs`. Nothing here marshals ndspy structs.
nsi-ffi-wrap = { path = "../nsi/crates/nsi-ffi-wrap", features = ["output"] }
# One ndspy struct, and only one: `PixelFormat::from_ndspy` takes the
# channel list in that shape, and it is the only public way to build the
# type the callbacks are handed. Nothing else here marshals ndspy.
ndspy-sys = "0.2"
# Reads the image MoonRay wrote, to hand it to an application's
# callbacks. A stopgap: with an in-process `RenderContext` the pixels
# come from `snapshotDelta` and never reach a file. See
# `specs/002-interactive-updates`.
exr = "1"

[dev-dependencies]
# The application side of the callback test: it writes the closure the
# way an ɴsɪ consumer does.
nsi-ffi-wrap = { path = "../nsi/crates/nsi-ffi-wrap", features = ["output"] }
# Loads the `cdylib` in `tests/dropin.rs` the way `nsi-ffi-wrap` loads a
# renderer: by `dlopen` and by symbol.
libloading = "0.8"
# For building `OwnedArg` values in `tests/render.rs`; the library
# itself already depends on it.
nsi-intermediate = { path = "../nsi/crates/nsi-intermediate" }
# Reads the rendered EXR in `tests/render.rs`, so the check is "the
# triangle is in the image" rather than "a file appeared".
exr = "1"
