[package]
name = "nsi-moonray"
version = "0.1.0"
authors = ["Moritz Moeller <virtualritz@protonmail.com>"]
edition = "2024"
# Matches the `nsi` workspace upstream.
rust-version = "1.88"
keywords = ["graphics", "rendering", "3d", "ray-tracing", "moonray"]
categories = ["graphics", "multimedia::images", "rendering::graphics-api"]
license = "MIT OR Apache-2.0 OR Zlib"
description = "An ɴsɪ backend on MoonRay, DreamWorks Animation's production renderer."
repository = "https://github.com/virtualritz/nsi-moonray/"
# Whitelist rather than blacklist, as upstream does: an `exclude` list
# silently ships `.specify/`, `specs/` and the handoff notes.
include = [
    "src/**/*",
    "shim/**/*",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
]

# The installers. `cargo packager` wraps a tree that
# `packaging/bundle.sh` has already assembled, so what ships is what
# `just bundle` produced and was tested -- not a second, parallel
# description of the same layout.
#
# **`just bundle` runs first.** `resources` names `dist/bundle/...`,
# which does not exist until it has: packaging a stale or absent bundle
# is how an installer ships without the renderer it exists to carry.
[package.metadata.packager]
product-name = "nsi-moonray"
identifier = "com.virtualritz.nsi-moonray"
publisher = "Moritz Moeller"
description = "An ɴsɪ backend on MoonRay, DreamWorks Animation's production renderer"
homepage = "https://github.com/virtualritz/nsi-moonray"
binaries = [{ path = "mnry", main = true }]
# Plain directories, not globs: cargo-packager 0.11.8 copies a
# directory recursively, and a `**` glob also matches the
# subdirectories and then fails on them. `lib/rdl2dso` is nested, so
# the glob form cannot work here.
resources = [
    { src = "dist/bundle/lib", target = "lib" },
    { src = "dist/bundle/share", target = "share" },
]

[package.metadata.packager.deb]
section = "graphics"

[package.metadata.packager.dmg]

# **No `wix` section, and that is the finding rather than an
# omission.** MoonRay does not build on Windows: its CMake handles Unix
# and Darwin and has no MSVC path, and `scene_rdl2` is compiled with
# `PLATFORM_UNIX`/`PLATFORM_LINUX`. A Windows package could carry this
# crate's emitter -- `mnry cat`, `.nsi` to `.rdla` -- and no renderer at
# all, which is a different product and should be named as one rather
# than shipped as a bundle that turns out to be empty.
# `specs/005-packaging/spec.md` has the reasoning.

[lib]
# `cdylib` so this can be `dlopen`ed as an ɴsɪ renderer -- see
# `src/capi.rs`; `rlib` so the flush stays usable as a Rust library.
crate-type = ["rlib", "cdylib"]

[features]
default = ["cli", "interned_handles"]
# Link `scene_rdl2` -- and, with it, build the scene in memory rather
# than writing a file. Off by default because it needs `scene_rdl2`
# installed and `$SCENE_RDL2_ROOT` pointing at it, while everything
# else here -- the emitter, the oracle, the flush -- is checked without
# a renderer and must stay that way.
rdl2 = []
# The `mnry` command. On by default so `cargo install nsi-moonray`
# gives you the renderer's front end; a library consumer that wants the
# flush and nothing else takes `default-features = false` and none of
# the argument parsing comes with it.
cli = [
    "dep:anyhow",
    "dep:clap",
    "dep:clap_complete",
    "dep:frame-sequence",
    "dep:notify",
]
# Intern ɴsɪ handles upstream, so a scene holds eight bytes a copy
# instead of a `String`. A handle is stored many times over -- the node
# key, both ends of every edge, three edge indexes.
#
# **On by default, on measured numbers rather than on principle.**
# `tools/footprint` records a 100 001-node scene at 144.6 MB and 35.3
# seconds as upstream ships, and 103.1 MB and 11.3 seconds interned:
# 29% smaller and 3.1x faster to build. The speed is not a side effect
# of the size -- `edges_to_attribute` had to build two `String`s to
# probe its key on every call.
#
# The cost is that `ustr`'s table is global and never freed, so a host
# that runs many *different* scenes in one process accumulates their
# handles. A renderer re-renders the same ones, which is why this is
# the right default here and might not be elsewhere.
#
# **Additive**, unlike `nsi-ffi-wrap`'s flag of the same name: it
# switches upstream's *storage* and every public signature still takes
# and returns `&str`, so a consumer that disagrees about the feature
# still compiles against this crate.
interned_handles = ["dep:ustr", "nsi-intermediate/ustr_handles"]

[build-dependencies]
# Builds `shim/src/scene.cc` when the `rdl2` feature is on. Not
# optional: a build script sees features as `CARGO_FEATURE_*` in the
# environment, never as a `cfg`, so it compiles either way and has to
# name what it might use. Build-only, so it costs no runtime
# dependency.
cc = "1"

[[bin]]
name = "mnry"
required-features = ["cli"]

[dependencies]
# `mnry` only. Errors that carry their cause up to `main` without a
# hand-written enum per failure mode.
anyhow = { version = "1", optional = true }
# `mnry` only. The subcommand shape is modelled on `rdl`, the `renderdl`
# replacement in `virtualritz/delight-helpers`, so someone who knows one
# knows the other.
clap = { version = "4", features = [
    "derive",
    "color",
    "env",
    "suggestions",
    "unicode",
    "wrap_help",
], optional = true }
clap_complete = { version = "4", optional = true }
# `mnry render --frames 10-20@2`. The same crate `rdl` uses, so the
# sequence syntax is identical down to the binary-splitting form.
frame-sequence = { version = "0.2", optional = true }
# `mnry watch`.
notify = { version = "8", optional = true }
# The intermediate representation this backend flushes.
#
# **Published, and `T0.7` is closed.** This was a path dependency on a
# sibling checkout for as long as the crate was unpublished -- a git
# dependency on that workspace makes Cargo fetch its private
# `.blueprints` submodule and fail, and `[patch]` does not help because
# Cargo fetches the patched source anyway. Neither applies now.
#
# To work on both at once, override it *locally* and do not commit the
# override: `[patch.crates-io] nsi-intermediate = { path = ... }` in a
# `.cargo/config.toml`, which is ignored here. Putting it in this file
# would put the sibling checkout back in everyone's way.
nsi-intermediate = "0.1"
# The same intern table upstream fills with every handle in the scene.
# `Name` -- a class name, a handle, an attribute name -- is a `Ustr`
# with this and a `Box<str>` without, and a flushed document is mostly
# those. See `src/name.rs` for why, and `research.md` F14 for what it
# was measured to cost before.
ustr = { version = "1", optional = true }
# The ɴsɪ types the C entry points speak: `FfiParam` is layout-identical
# to `NSIParam_t`, and `Type` carries the `NSIType_t` values.
nsi-trait = "0.4.2"
# For the output-driver callbacks an application hands ɴsɪ. MoonRay has
# no display-driver interface, so this crate calls those closures
# itself; see `src/display.rs`. Nothing here marshals ndspy structs.
nsi-ffi-wrap = { version = "0.10.2", features = ["output"] }
# One ndspy struct, and only one: `PixelFormat::from_ndspy` takes the
# channel list in that shape, and it is the only public way to build the
# type the callbacks are handed. Nothing else here marshals ndspy.
ndspy-sys = "0.2"
# Reads the image MoonRay wrote, to hand it to an application's
# callbacks. A stopgap: with an in-process `RenderContext` the pixels
# come from `snapshotDelta` and never reach a file. See
# `specs/002-interactive-updates`.
exr = "1"
# Checks an emitted OSL group specification against the shader it
# names, *before* OSL sees it.
#
# Measured, against OSL 1.13: a parameter the shader lacks draws a
# warning that names the parameter and not the ɴsɪ node that asked for
# it; a value set on an **output** draws nothing at all and the shader
# renders its default; and a connection from a non-output refuses the
# whole group, so the surface shades nothing. One silent, one
# misattributed, one fatal. With the declarations in hand all three
# become limitations naming the handle -- which is ɴsɪ's rule, not a
# nicety.
#
# Not optional, and pure Rust: it reads `.oso`, which is a text format,
# so this costs no C++ toolchain and works in a build that has no OSL
# at all. That matters because `Shading::Osl` is a choice rather than a
# `cfg` -- a scene flushed here may be rendered somewhere else.
oslquery-petite = "0.1.2"
# Reads a `.nsi` stream, so `mnry` takes ɴsɪ as well as `.rdla`. It
# drives `nsi_trait::Nsi`, which `nsi_intermediate::Recorder`
# implements, so the parser feeds this backend with nothing to write
# here but the wiring. `gzip` because 3Delight writes compressed
# streams and a caller who took a file from a pipeline should not have
# to know that.
nsi-parse = { version = "0.1", features = ["gzip"] }

[dev-dependencies]
# The application side of the callback test: it writes the closure the
# way an ɴsɪ consumer does.
nsi-ffi-wrap = { version = "0.10.2", features = ["output"] }
# Loads the `cdylib` in `tests/dropin.rs` the way `nsi-ffi-wrap` loads a
# renderer: by `dlopen` and by symbol.
libloading = "0.8"
# For the ɴsɪ types the in-process tests build arguments with.
nsi-trait = "0.4.2"
# For building `OwnedArg` values in `tests/render.rs`; the library
# itself already depends on it.
nsi-intermediate = "0.1"
# Reads the rendered EXR in `tests/render.rs`, so the check is "the
# triangle is in the image" rather than "a file appeared".
exr = "1"
