[package]
name = "nsi-moonray"
version = "0.1.0"
authors = ["Moritz Moeller <virtualritz@protonmail.com>"]
edition = "2024"
# Matches the `nsi` workspace upstream.
rust-version = "1.88"
keywords = ["graphics", "rendering", "3d", "ray-tracing", "moonray"]
categories = ["graphics", "multimedia::images", "rendering::graphics-api"]
license = "MIT OR Apache-2.0 OR Zlib"
description = "An ɴsɪ backend on MoonRay, DreamWorks Animation's production renderer."
repository = "https://github.com/virtualritz/nsi-moonray/"
# Whitelist rather than blacklist, as upstream does: an `exclude` list
# silently ships `.specify/`, `specs/` and the handoff notes.
include = [
    "src/**/*",
    "/Cargo.toml",
    "/README.md",
]

[dependencies]
# The intermediate representation this backend flushes, overlaid from a
# sibling checkout of https://github.com/virtualritz/nsi.
#
# A path dependency, and deliberately so *for now*: the crate is
# unpublished, and a git dependency on that workspace makes Cargo fetch
# the repository's private `.blueprints` submodule, which fails without
# access to it. `[patch]` does not help -- Cargo fetches the patched
# source anyway. So until `nsi-intermediate` is published, or the
# submodule stops blocking a fetch, building this crate means cloning
# `nsi` next to it. `T0.7`.
nsi-intermediate = { path = "../nsi/crates/nsi-intermediate" }

[dev-dependencies]
# For building `OwnedArg` values in the flush tests. Same overlay.
nsi-trait = { path = "../nsi/crates/nsi-trait" }
