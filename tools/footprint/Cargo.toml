[package]
name = "footprint"
version = "0.0.0"
edition = "2024"
publish = false

[features]
# `nsi-moonray`'s `interned_handles`, which turns on upstream's
# `ustr_handles` *and* this crate's own interned `Name`. One flag, so
# the two halves of the measurement differ in exactly one thing --
# which is also how the crate ships it.
interned = ["nsi-moonray/interned_handles"]

[dependencies]
# Sibling checkouts, the same convention the crate itself uses.
nsi-intermediate = { path = "../../../nsi/crates/nsi-intermediate" }
nsi-trait = { path = "../../../nsi/crates/nsi-trait" }
nsi-moonray = { path = "../..", default-features = false }

# Its own workspace: this is a measuring instrument, not part of the
# crate, and it must be buildable with a feature the crate under
# measurement does not have on.
[workspace]
